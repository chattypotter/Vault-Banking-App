<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-dark:#224248;
    --teal-mid:#325E6A;
    --teal-bright:#44A1A4;
    --orange:#FF9A00;
    --clay:#C97C3D;
    --slate:#8AA9AE;

    --bg:#F4F6F5;
    --card:#FFFFFF;
    --card-2:#FFFFFF;
    --ink:#17282B;
    --ink-soft:#657679;
    --line:#E3E8E7;
    --shadow: 0 10px 30px -18px rgba(23,40,43,0.35);
  }
  body.dark{
    --bg:#0E1719;
    --card:#152528;
    --card-2:#182A2D;
    --ink:#EAF1F0;
    --ink-soft:#89A0A2;
    --line:#233638;
    --shadow: 0 10px 30px -16px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
    min-height:100vh;
    transition:background .25s ease, color .25s ease;
  }
  .app{ width:100%; max-width:400px; position:relative; display:flex; flex-direction:column; min-height:calc(100vh - 88px); }

  /* header */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .word{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .word-dot{ width:7px;height:7px;border-radius:50%; background:var(--orange); }
  .icon-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--ink);
    transition:background .2s;
    flex:0 0 auto;
  }
  .icon-btn svg{ width:16px;height:16px; }

  /* centered auth content */
  .auth-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:8px 0 0;
  }

  .brand-mark{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:22px;
  }
  .brand-circle{
    width:52px;height:52px;border-radius:16px;
    background:var(--teal-dark);
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
  }
  body.dark .brand-circle{ background:var(--teal-bright); }
  .brand-circle svg{ width:24px;height:24px;color:#F3F7F6; }
  body.dark .brand-circle svg{ color:#0E1719; }

  .auth-heading{
    text-align:center;
    margin-bottom:28px;
  }
  .auth-heading h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:25px;
    letter-spacing:-0.01em;
    margin:0 0 6px;
  }
  .auth-heading p{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0;
    line-height:1.5;
  }

  .auth-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:24px 22px 22px;
    box-shadow:var(--shadow);
  }

  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:7px;
  }
  .field input{
    width:100%;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    border-radius:12px;
    padding:12px 13px;
    font-family:'Inter',sans-serif;
    font-size:15px;
    outline:none;
    transition:border-color .15s;
    appearance:none;
    -webkit-appearance:none;
  }
  .field input:focus{ border-color:var(--teal-bright); }
  .field .input-wrap{ position:relative; }
  .field .input-wrap input{ padding-right:42px; }
  .field-toggle{
    position:absolute; right:11px; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border-radius:50%;
    border:none; background:transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink-soft); padding:0;
  }
  .field-toggle svg{ width:16px;height:16px; }

  .field-error{ font-size:12px; color:var(--orange); margin-top:6px; display:none; }
  .field-error.show{ display:block; }

  .auth-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
    margin-top:4px;
  }
  .remember{
    display:flex; align-items:center; gap:8px;
    font-size:13px; color:var(--ink-soft);
    cursor:pointer; user-select:none;
  }
  .remember input{
    width:16px; height:16px;
    accent-color:var(--teal-bright);
    cursor:pointer;
  }
  .forgot-link{
    font-size:13px; font-weight:600;
    color:var(--teal-mid);
    text-decoration:none;
  }
  body.dark .forgot-link{ color:var(--teal-bright); }

  .btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:14px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    transition:opacity .15s;
  }
  .btn:active{ opacity:0.8; }
  .btn:disabled{ opacity:0.5; cursor:default; }
  .btn-primary{ background:var(--teal-dark); color:#F3F7F6; }
  body.dark .btn-primary{ background:var(--teal-bright); color:#0E1719; }

  .divider{
    display:flex; align-items:center; gap:12px;
    margin:20px 0;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .divider::before, .divider::after{
    content:''; flex:1; height:1px; background:var(--line);
  }

  .biometric-btn{
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:10px;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    border-radius:14px;
    padding:12px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    transition:border-color .15s;
  }
  .biometric-btn:active{ border-color:var(--teal-bright); }
  .biometric-btn svg{ width:17px;height:17px; color:var(--teal-bright); }

  .signup-note{
    text-align:center;
    margin-top:22px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .signup-note a{
    color:var(--teal-mid);
    font-weight:600;
    text-decoration:none;
  }
  body.dark .signup-note a{ color:var(--teal-bright); }

  footer{
    text-align:center; margin-top:26px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; color:var(--ink-soft); letter-spacing:.03em;
  }
  footer svg{ width:11px;height:11px; vertical-align:-1px; margin-right:4px; color:var(--slate); }
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <div class="word">
      <span class="word-dot"></span>
      VAULT
    </div>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
      </svg>
    </button>
  </div>

  <div class="auth-wrap">

    <div class="brand-mark">
      <div class="brand-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
    </div>

    <div class="auth-heading">
      <h1>Welcome back</h1>
      <p>Log in to your Vault account to continue.</p>
    </div>

    <div class="auth-card">
      <form id="loginForm" novalidate>

        <div class="field">
          <label for="emailInput">Email or username</label>
          <input type="text" id="emailInput" name="email" placeholder="you@example.com" autocomplete="username">
        </div>

        <div class="field">
          <label for="passwordInput">Password</label>
          <div class="input-wrap">
            <input type="password" id="passwordInput" name="password" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="field-toggle" id="pwToggle" aria-label="Show password">
              <svg id="pwToggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="field-error" id="loginError">That email/username and password combination doesn't match.</div>
        </div>

        <div class="auth-row">
          <label class="remember">
            <input type="checkbox" id="rememberMe">
            Remember me
          </label>
          <a href="#" class="forgot-link" id="forgotLink">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">Log In</button>

      </form>

      <div class="divider">or</div>

      <button type="button" class="biometric-btn" id="biometricBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a4 4 0 0 0-4 4v3a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"></path>
          <path d="M6 8v5a6 6 0 0 0 12 0V8"></path>
          <path d="M12 19v3"></path>
        </svg>
        Log in with Face ID
      </button>

      <div class="signup-note">
        New to Vault? <a href="#">Create an account</a>
      </div>
    </div>

  </div>

  <footer>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="11" width="14" height="9" rx="1.5"></rect>
      <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
    </svg>
    Secured with 256-bit encryption
  </footer>

</div>

<script>
  /* ---------- theme ---------- */
  function renderThemeIcon(){
    const isDark = document.body.classList.contains('dark');
    document.getElementById('themeIcon').innerHTML = isDark
      ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>'
      : '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>';
  }
  document.getElementById('themeToggle').addEventListener('click', () => {
    document.body.classList.toggle('dark');
    renderThemeIcon();
  });
  renderThemeIcon();

  /* ---------- password visibility ---------- */
  document.getElementById('pwToggle').addEventListener('click', () => {
    const input = document.getElementById('passwordInput');
    const icon = document.getElementById('pwToggleIcon');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    icon.innerHTML = showing
      ? '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle>'
      : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 4.22-5.19M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><path d="M1 1l22 22"></path>';
  });

  /* ---------- form submit (demo only, no backend) ---------- */
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const errorEl = document.getElementById('loginError');

    if (!email || !password){
      errorEl.textContent = "Please enter both your email/username and password.";
      errorEl.classList.add('show');
      return;
    }

    // Placeholder — wire this up to your real auth endpoint.
    errorEl.classList.remove('show');
    alert('Login submitted for: ' + email);
  });

  document.getElementById('forgotLink').addEventListener('click', (e) => {
    e.preventDefault();
    alert('Redirect to password reset flow.');
  });

  document.getElementById('biometricBtn').addEventListener('click', () => {
    alert('Trigger platform biometric auth here.');
  });
</script>

</body>
</html>
